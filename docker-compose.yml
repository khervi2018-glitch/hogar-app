version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hogar_postgres
    restart: always
    environment:
      POSTGRES_USER: hogar_user
      POSTGRES_PASSWORD: hogar_pass
      POSTGRES_DB: hogar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hogar_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: